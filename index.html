<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON RUNNER</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
    }

    body {
        overflow: hidden;
        background: #050510;
        font-family: Arial, sans-serif;
    }

    canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #050510;
    }

    #ui {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        padding: 18px 25px;
        display: flex;
        justify-content: space-between;
        color: white;
        font-size: 20px;
        font-weight: bold;
        pointer-events: none;
        text-shadow: 0 0 10px #00eaff;
    }

    #startScreen,
    #gameOverScreen,
    #pauseScreen {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        background: rgba(3, 3, 15, 0.82);
        color: white;
        z-index: 5;
    }

    #gameOverScreen,
    #pauseScreen {
        display: none;
    }

    h1 {
        font-size: clamp(45px, 9vw, 100px);
        color: #00eaff;
        text-shadow:
            0 0 10px #00eaff,
            0 0 30px #008cff,
            0 0 60px #008cff;
        margin-bottom: 10px;
        letter-spacing: 5px;
    }

    .subtitle {
        color: #ccc;
        margin-bottom: 30px;
        text-align: center;
        font-size: 18px;
    }

    button {
        border: 2px solid #00eaff;
        background: transparent;
        color: #00eaff;
        padding: 14px 35px;
        border-radius: 10px;
        font-size: 18px;
        cursor: pointer;
        transition: .2s;
        box-shadow: 0 0 15px rgba(0,234,255,.4);
    }

    button:hover {
        background: #00eaff;
        color: #050510;
        box-shadow: 0 0 30px #00eaff;
        transform: scale(1.05);
    }

    #controls {
        margin-top: 25px;
        color: #aaa;
        text-align: center;
        line-height: 1.8;
    }

    #mobileControls {
        position: fixed;
        bottom: 20px;
        left: 0;
        width: 100%;
        display: none;
        justify-content: space-around;
        z-index: 4;
    }

    .mobileBtn {
        width: 80px;
        height: 60px;
        padding: 0;
        border-radius: 15px;
        font-size: 25px;
        background: rgba(0,234,255,.08);
        backdrop-filter: blur(5px);
    }

    @media (max-width: 700px) {
        #mobileControls {
            display: flex;
        }

        #controls {
            font-size: 14px;
        }
    }
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">
    <div>🏆 SCORE: <span id="score">0</span></div>
    <div>🪙 <span id="coins">0</span></div>
    <div>⚡ x<span id="speed">1.0</span></div>
</div>

<div id="startScreen">
    <h1>NEON RUNNER</h1>
    <div class="subtitle">
        Lari sejauh mungkin.<br>
        Hindari jebakan. Ambil koin. Pecahkan rekor.
    </div>

    <button onclick="startGame()">START GAME</button>

    <div id="controls">
        ⬆ / W / SPACE = Lompat<br>
        SHIFT = Dash<br>
        P = Pause
    </div>
</div>

<div id="gameOverScreen">
    <h1>GAME OVER</h1>

    <div class="subtitle">
        Score: <span id="finalScore">0</span><br>
        Rekor: <span id="highScore">0</span>
    </div>

    <button onclick="startGame()">MAIN LAGI</button>
</div>

<div id="pauseScreen">
    <h1>PAUSED</h1>
    <div class="subtitle">Tekan P untuk melanjutkan</div>
</div>

<div id="mobileControls">
    <button class="mobileBtn" id="jumpBtn">⬆</button>
    <button class="mobileBtn" id="dashBtn">⚡</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

const scoreText = document.getElementById("score");
const coinText = document.getElementById("coins");
const speedText = document.getElementById("speed");

const startScreen = document.getElementById("startScreen");
const gameOverScreen = document.getElementById("gameOverScreen");
const pauseScreen = document.getElementById("pauseScreen");

const finalScore = document.getElementById("finalScore");
const highScore = document.getElementById("highScore");

let gameRunning = false;
let paused = false;

let score = 0;
let coins = 0;
let distance = 0;

let gameSpeed = 7;
let maxSpeed = 18;

let obstacleTimer = 0;
let coinTimer = 0;

let lastTime = 0;

const keys = {};

document.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;

    if (
        e.key === " " ||
        e.key === "ArrowUp" ||
        e.key.toLowerCase() === "w"
    ) {
        e.preventDefault();
        jump();
    }

    if (e.key === "Shift") {
        dash();
    }

    if (e.key.toLowerCase() === "p") {
        togglePause();
    }

    if (e.key === "r" && !gameRunning) {
        startGame();
    }
});

document.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});


// =========================
// PLAYER
// =========================

const player = {
    x: 120,
    y: 0,

    width: 38,
    height: 55,

    velocityY: 0,

    gravity: 0.85,
    jumpPower: -16,

    jumps: 0,
    maxJumps: 2,

    grounded: false,

    dashTimer: 0,
    dashCooldown: 0,

    color: "#00eaff"
};


// =========================
// OBJECTS
// =========================

let obstacles = [];
let coinsList = [];
let particles = [];
let stars = [];

function createStars() {
    stars = [];

    for (let i = 0; i < 120; i++) {
        stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height * 0.65,
            size: Math.random() * 2 + 0.5,
            speed: Math.random() * 0.5 + 0.1
        });
    }
}

createStars();


// =========================
// START
// =========================

function startGame() {

    gameRunning = true;
    paused = false;

    score = 0;
    coins = 0;
    distance = 0;

    gameSpeed = 7;

    obstacleTimer = 0;
    coinTimer = 0;

    obstacles = [];
    coinsList = [];
    particles = [];

    player.y = getGroundY() - player.height;
    player.velocityY = 0;

    player.jumps = 0;
    player.grounded = true;

    player.dashTimer = 0;
    player.dashCooldown = 0;

    startScreen.style.display = "none";
    gameOverScreen.style.display = "none";
    pauseScreen.style.display = "none";

    lastTime = performance.now();

    requestAnimationFrame(gameLoop);
}


// =========================
// GROUND
// =========================

function getGroundY() {
    return canvas.height - 90;
}


// =========================
// JUMP
// =========================

function jump() {

    if (!gameRunning || paused) return;

    if (player.jumps < player.maxJumps) {

        player.velocityY = player.jumpPower;

        player.jumps++;

        createJumpParticles();
    }
}


// =========================
// DASH
// =========================

function dash() {

    if (!gameRunning || paused) return;

    if (player.dashCooldown <= 0) {

        player.dashTimer = 15;
        player.dashCooldown = 70;

        for (let i = 0; i < 15; i++) {

            particles.push({
                x: player.x,
                y: player.y + player.height / 2,

                vx: -Math.random() * 8,
                vy: (Math.random() - .5) * 4,

                life: 25,
                size: Math.random() * 5 + 2
            });

        }
    }
}


// =========================
// PARTICLES
// =========================

function createJumpParticles() {

    for (let i = 0; i < 8; i++) {

        particles.push({
            x: player.x + player.width / 2,
            y: getGroundY(),

            vx: (Math.random() - 0.5) * 5,
            vy: -Math.random() * 4,

            life: 30,
            size: Math.random() * 4 + 2
        });

    }
}


// =========================
// SPAWN OBSTACLE
// =========================

function spawnObstacle() {

    const type = Math.floor(Math.random() * 3);

    if (type === 0) {

        obstacles.push({
            x: canvas.width + 50,
            y: getGroundY() - 35,

            width: 35,
            height: 35,

            type: "spike"
        });

    } else if (type === 1) {

        obstacles.push({
            x: canvas.width + 50,
            y: getGroundY() - 70,

            width: 45,
            height: 70,

            type: "wall"
        });

    } else {

        obstacles.push({
            x: canvas.width + 50,
            y: getGroundY() - 115,

            width: 45,
            height: 20,

            type: "laser"
        });
    }
}


// =========================
// SPAWN COINS
// =========================

function spawnCoin() {

    const height = getGroundY() - 70 - Math.random() * 180;

    coinsList.push({
        x: canvas.width + 40,
        y: height,

        radius: 10,

        rotation: Math.random() * Math.PI
    });
}


// =========================
// COLLISION
// =========================

function collision(a, b) {

    return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
    );
}


// =========================
// GAME OVER
// =========================

function gameOver() {

    gameRunning = false;

    const oldHigh = Number(localStorage.getItem("neonHighScore") || 0);

    if (score > oldHigh) {
        localStorage.setItem("neonHighScore", score);
    }

    finalScore.textContent = score;

    highScore.textContent =
        Math.max(score, oldHigh);

    gameOverScreen.style.display = "flex";
}


// =========================
// PAUSE
// =========================

function togglePause() {

    if (!gameRunning) return;

    paused = !paused;

    pauseScreen.style.display =
        paused ? "flex" : "none";

    if (!paused) {
        lastTime = performance.now();
        requestAnimationFrame(gameLoop);
    }
}


// =========================
// UPDATE
// =========================

function update(delta) {

    const dt = delta / 16.67;

    // speed increases gradually
    gameSpeed += 0.0025 * dt;

    if (gameSpeed > maxSpeed) {
        gameSpeed = maxSpeed;
    }

    distance += gameSpeed * dt;

    score = Math.floor(distance / 10);

    // player physics
    player.velocityY += player.gravity * dt;
    player.y += player.velocityY * dt;

    const ground = getGroundY();

    if (player.y + player.height >= ground) {

        player.y = ground - player.height;

        player.velocityY = 0;

        player.grounded = true;
        player.jumps = 0;

    } else {

        player.grounded = false;
    }

    // dash
    if (player.dashTimer > 0) {
        player.dashTimer -= dt;
    }

    if (player.dashCooldown > 0) {
        player.dashCooldown -= dt;
    }

    // obstacle spawn
    obstacleTimer -= gameSpeed * dt;

    if (obstacleTimer <= 0) {

        spawnObstacle();

        obstacleTimer =
            170 + Math.random() * 180;
    }

    // coin spawn
    coinTimer -= gameSpeed * dt;

    if (coinTimer <= 0) {

        spawnCoin();

        coinTimer =
            100 + Math.random() * 160;
    }


    // obstacles
    for (let i = obstacles.length - 1; i >= 0; i--) {

        const obstacle = obstacles[i];

        let speed = gameSpeed;

        if (player.dashTimer > 0) {
            speed *= 1.8;
        }

        obstacle.x -= speed * dt;

        if (collision(player, obstacle)) {

            if (player.dashTimer <= 0) {

                gameOver();
                return;
            }
        }

        if (obstacle.x + obstacle.width < -100) {
            obstacles.splice(i, 1);
        }
    }


    // coins
    for (let i = coinsList.length - 1; i >= 0; i--) {

        const coin = coinsList[i];

        coin.x -= gameSpeed * dt;

        const px =
            player.x + player.width / 2;

        const py =
            player.y + player.height / 2;

        const dx = px - coin.x;
        const dy = py - coin.y;

        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < 28) {

            coins++;

            distance += 50;

            for (let j = 0; j < 10; j++) {

                particles.push({
                    x: coin.x,
                    y: coin.y,

                    vx: (Math.random() - .5) * 6,
                    vy: (Math.random() - .5) * 6,

                    life: 30,
                    size: Math.random() * 5 + 2
                });
            }

            coinsList.splice(i, 1);
        }

        else if (coin.x < -50) {

            coinsList.splice(i, 1);
        }
    }


    // particles
    for (let i = particles.length - 1; i >= 0; i--) {

        const p = particles[i];

        p.x += p.vx * dt;
        p.y += p.vy * dt;

        p.life -= dt;

        if (p.life <= 0) {
            particles.splice(i, 1);
        }
    }


    // update UI
    scoreText.textContent = score;
    coinText.textContent = coins;
    speedText.textContent =
        (gameSpeed / 7).toFixed(1);
}


// =========================
// DRAW BACKGROUND
// =========================

function drawBackground() {

    // sky
    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            canvas.height
        );

    gradient.addColorStop(0, "#050018");
    gradient.addColorStop(.5, "#10052d");
    gradient.addColorStop(1, "#020207");

    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // stars
    for (const star of stars) {

        star.x -= star.speed * gameSpeed * 0.05;

        if (star.x < 0) {
            star.x = canvas.width;
        }

        ctx.fillStyle =
            `rgba(255,255,255,${0.3 + Math.random() * .7})`;

        ctx.beginPath();

        ctx.arc(
            star.x,
            star.y,
            star.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    // giant moon
    ctx.shadowBlur = 40;
    ctx.shadowColor = "#7733ff";

    ctx.fillStyle = "#22124a";

    ctx.beginPath();

    ctx.arc(
        canvas.width - 130,
        130,
        70,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.shadowBlur = 0;


    // distant city
    const ground = getGroundY();

    for (
        let x = 0;
        x < canvas.width + 100;
        x += 70
    ) {

        const height =
            30 + ((x * 13) % 90);

        ctx.fillStyle = "#09091c";

        ctx.fillRect(
            x,
            ground - height,
            55,
            height
        );

        // windows
        for (
            let wy = ground - height + 10;
            wy < ground - 5;
            wy += 15
        ) {

            if (Math.random() > .4) {

                ctx.fillStyle = "#30306a";

                ctx.fillRect(
                    x + 10,
                    wy,
                    5,
                    5
                );
            }
        }
    }


    // ground
    ctx.fillStyle = "#08081a";

    ctx.fillRect(
        0,
        ground,
        canvas.width,
        canvas.height - ground
    );

    ctx.strokeStyle = "#00eaff";
    ctx.lineWidth = 3;

    ctx.shadowBlur = 15;
    ctx.shadowColor = "#00eaff";

    ctx.beginPath();

    ctx.moveTo(
        0,
        ground
    );

    ctx.lineTo(
        canvas.width,
        ground
    );

    ctx.stroke();

    ctx.shadowBlur = 0;


    // moving ground lines
    const offset =
        -(distance * 1.5 % 80);

    for (
        let x = offset;
        x < canvas.width;
        x += 80
    ) {

        ctx.fillStyle = "#13133a";

        ctx.fillRect(
            x,
            ground + 25,
            50,
            3
        );
    }
}


// =========================
// DRAW PLAYER
// =========================

function drawPlayer() {

    ctx.save();

    ctx.translate(
        player.x + player.width / 2,
        player.y + player.height / 2
    );

    if (player.dashTimer > 0) {

        ctx.shadowBlur = 35;
        ctx.shadowColor = "#00eaff";
    }

    ctx.fillStyle = player.color;

    // body
    ctx.fillRect(
        -player.width / 2,
        -player.height / 2,
        player.width,
        player.height
    );

    // helmet
    ctx.fillStyle = "#ffffff";

    ctx.fillRect(
        -5,
        -17,
        17,
        12
    );

    // eye
    ctx.fillStyle = "#111";

    ctx.fillRect(
        5,
        -14,
        5,
        5
    );


    // legs animation
    const legMove =
        Math.sin(distance * .25) * 8;

    ctx.fillStyle = "#0086a8";

    ctx.fillRect(
        -15,
        20,
        10,
        15 + legMove
    );

    ctx.fillRect(
        5,
        20,
        10,
        15 - legMove
    );

    ctx.restore();
}


// =========================
// DRAW OBSTACLES
// =========================

function drawObstacles() {

    for (const obstacle of obstacles) {

        ctx.save();

        if (obstacle.type === "spike") {

            ctx.fillStyle = "#ff1744";

            ctx.shadowBlur = 20;
            ctx.shadowColor = "#ff1744";

            ctx.beginPath();

            ctx.moveTo(
                obstacle.x,
                obstacle.y + obstacle.height
            );

            ctx.lineTo(
                obstacle.x + obstacle.width / 2,
                obstacle.y
            );

            ctx.lineTo(
                obstacle.x + obstacle.width,
                obstacle.y + obstacle.height
            );

            ctx.closePath();

            ctx.fill();

        }

        else if (obstacle.type === "wall") {

            ctx.fillStyle = "#ff00d9";

            ctx.shadowBlur = 25;
            ctx.shadowColor = "#ff00d9";

            ctx.fillRect(
                obstacle.x,
                obstacle.y,
                obstacle.width,
                obstacle.height
            );

            ctx.fillStyle = "#ff89ee";

            ctx.fillRect(
                obstacle.x + 8,
                obstacle.y + 8,
                8,
                obstacle.height - 16
            );
        }

        else {

            ctx.fillStyle = "#ffe600";

            ctx.shadowBlur = 25;
            ctx.shadowColor = "#ffe600";

            ctx.fillRect(
                obstacle.x,
                obstacle.y,
                obstacle.width,
                obstacle.height
            );

        }

        ctx.restore();
    }
}


// =========================
// DRAW COINS
// =========================

function drawCoins() {

    for (const coin of coinsList) {

        coin.rotation += .08;

        const squish =
            Math.abs(Math.cos(coin.rotation));

        ctx.save();

        ctx.translate(
            coin.x,
            coin.y
        );

        ctx.scale(
            squish,
            1
        );

        ctx.fillStyle = "#ffd700";

        ctx.shadowBlur = 20;
        ctx.shadowColor = "#ffd700";

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            coin.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.restore();
    }
}


// =========================
// DRAW PARTICLES
// =========================

function drawParticles() {

    for (const p of particles) {

        ctx.globalAlpha =
            Math.max(0, p.life / 30);

        ctx.fillStyle = "#00eaff";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.globalAlpha = 1;
}


// =========================
// MAIN LOOP
// =========================

function gameLoop(timestamp) {

    if (!gameRunning || paused) return;

    const delta =
        Math.min(timestamp - lastTime, 40);

    lastTime = timestamp;

    update(delta);

    drawBackground();
    drawCoins();
    drawObstacles();
    drawParticles();
    drawPlayer();

    requestAnimationFrame(gameLoop);
}


// =========================
// MOBILE CONTROLS
// =========================

document.getElementById("jumpBtn")
    .addEventListener("touchstart", e => {

        e.preventDefault();
        jump();

    });

document.getElementById("dashBtn")
    .addEventListener("touchstart", e => {

        e.preventDefault();
        dash();

    });


// mouse fallback
document.getElementById("jumpBtn")
    .addEventListener("mousedown", jump);

document.getElementById("dashBtn")
    .addEventListener("mousedown", dash);

</script>

</body>
</html>
